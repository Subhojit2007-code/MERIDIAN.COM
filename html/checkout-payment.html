<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment — Meridian</title>
  <meta name="description" content="Choose how to pay for your Meridian order." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html"><span class="mark">M</span><span data-store-name>Meridian</span></a>
      <nav class="main-nav" aria-label="Primary">
        <a href="../index.html">Shop</a>
        <a href="../index.html#catalogue" data-scroll>Categories</a>
      </nav>
      <div class="header-actions">
        <form class="search" role="search" action="search.html" method="get" id="search-form">
          <input type="search" id="search-input" name="q" placeholder="Search products…" aria-label="Search products" autocomplete="off" />
          <button type="submit" aria-label="Search">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </form>
        <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.6C1.2 8.4 3 5 6.4 5c2 0 3.4 1 4.1 2.3h3c.7-1.3 2.1-2.3 4.1-2.3 3.4 0 5.2 3.4 3.6 6.4C19 15.4 12 20 12 20Z" transform="translate(0 -1)"/></svg>
          <span class="icon-badge" data-wishlist-count data-count="0">0</span>
        </a>
        <a class="icon-btn" href="orders.html" aria-label="Your orders">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        </a>
        <a class="icon-btn" href="profile.html" aria-label="Your profile">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        </a>
        <a class="cart-link" href="cart.html" aria-label="View cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.3 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 7H5.3"/></svg>
          <span>Cart</span>
          <span class="cart-badge" data-cart-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="checkout-card">
      <div class="page-head"><h1>Payment</h1><p>Choose how you'd like to pay for this order.</p></div>

      <div id="pay-panel">
        <section class="panel">
          <div class="panel-row">
            <div>
              <span class="attr-label">Deliver to</span>
              <div class="addr-name" id="pay-name"></div>
              <div class="addr-lines" id="pay-address"></div>
            </div>
            <a class="btn btn-outline" href="checkout-address.html">Change</a>
          </div>
        </section>

        <section class="panel" style="margin-top:14px">
          <span class="attr-label">Payment method</span>
          <div class="pay-opts" id="pay-opts"></div>

          <div class="sum-row"><span>Subtotal</span><span id="sum-subtotal">—</span></div>
          <div class="sum-row"><span>Shipping</span><span id="sum-shipping">—</span></div>
          <div class="sum-row total"><span>Total</span><span id="sum-total">—</span></div>

          <button class="btn btn-primary order-now" id="order-now" type="button">Order Now</button>
          <div id="pay-notice"></div>
        </section>
      </div>

      <p class="empty" id="pay-empty" hidden>Your cart is empty. <a href="../index.html" style="color:var(--accent);font-weight:600">Browse the catalogue</a>.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div><p>© 2026 <span data-store-name>Meridian</span> Supply Co. Sample storefront — products and prices are illustrative.</p></div>
      <nav class="footer-links" aria-label="Footer">
        <a href="../index.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="admin.html">Admin</a>
        <button type="button" data-policy-open aria-haspopup="dialog">Store policy</button>
      </nav>
    </div>
  </footer>

  <script src="../js/images.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/store.js"></script>
  <script>
    const CHECKOUT_URL = "/functions/v1/app/create-checkout-session";
    const RAZORPAY_ORDER_URL = "/functions/v1/app/create-razorpay-order";
    const RAZORPAY_VERIFY_URL = "/functions/v1/app/verify-razorpay-payment";
    const RAZORPAY_SCRIPT = "https://checkout.razorpay.com/v1/checkout.js";
    const panelEl = document.getElementById("pay-panel");
    const emptyEl = document.getElementById("pay-empty");
    const noticeEl = document.getElementById("pay-notice");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Cash on Delivery is always on offer; every gateway the admin enabled in
    // the Payments tab adds its own UPI option, preferred gateway first.
    const gateways = upiOptions();
    document.getElementById("pay-opts").innerHTML =
      `<label class="pay-opt" for="pm-cod">
        <input type="radio" name="pm" id="pm-cod" value="cod" checked />
        <span class="pay-opt-text">
          <span class="pay-opt-name">Cash on Delivery</span>
          <span class="pay-opt-note">Pay in cash when your order arrives.</span>
        </span>
      </label>` +
      gateways.map((g) =>
        `<label class="pay-opt" for="pm-upi-${esc(g.id)}">
          <input type="radio" name="pm" id="pm-upi-${esc(g.id)}" value="upi:${esc(g.id)}" />
          <span class="pay-opt-text">
            <span class="pay-opt-name">${gateways.length > 1 ? `Pay by UPI — ${esc(g.label)}` : "Pay by UPI"}</span>
            <span class="pay-opt-note">Approve the payment in your UPI app on ${esc(g.label)}'s secure page.</span>
          </span>
        </label>`).join("");

    let address = null;

    // Nothing to pay for without a cart, and nothing to deliver without an
    // address — the address page collects it.
    if (!requireAccount("checkout")) {
      panelEl.hidden = true;
    } else if (!cartEntries().length) {
      panelEl.hidden = true;
      emptyEl.hidden = false;
    } else {
      address = getSavedAddress();
      if (!addressComplete(address)) location.replace("checkout-address.html");
      document.getElementById("pay-name").textContent = address.name;
      document.getElementById("pay-address").innerHTML = addressLines(address).map((l) => esc(l)).join("<br>");

      const subtotal = cartSubtotal();
      const shipping = subtotal >= freeShippingThreshold() ? 0 : SHIPPING_FLAT;
      document.getElementById("sum-subtotal").textContent = money(subtotal);
      document.getElementById("sum-shipping").textContent = shipping === 0 ? "Free" : money(shipping);
      document.getElementById("sum-total").textContent = money(subtotal + shipping);
    }

    function warn(msg) {
      noticeEl.innerHTML = `<div class="notice warn">${esc(msg)}</div>`;
    }
    // The gateway pricing the function trusts, aggregated by base product id.
    function cartItems() {
      const agg = new Map();
      cartEntries().forEach((e) => {
        const id = e.product.id;
        agg.set(id, Math.min(MAX_QUANTITY, (agg.get(id) || 0) + e.quantity));
      });
      return Array.from(agg, ([id, quantity]) => ({ id, quantity }));
    }
    function notConfiguredMessage(g) {
      return g.id === "razorpay"
        ? `Razorpay isn't configured on this site yet. Add ${g.secretEnv} and RAZORPAY_KEY_ID in Sites Settings, or choose another payment method.`
        : `UPI through ${g.label} isn't configured on this site yet. Add ${g.secretEnv} in Sites Settings, or choose another payment method.`;
    }

    let rzpLoading = null;
    function loadRazorpay() {
      if (window.Razorpay) return Promise.resolve();
      if (!rzpLoading) {
        rzpLoading = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = RAZORPAY_SCRIPT;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => { rzpLoading = null; reject(new Error("script_failed")); };
          document.head.appendChild(s);
        });
      }
      return rzpLoading;
    }

    async function postJSON(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(payload),
      });
      return { res, data: await res.json().catch(() => ({})) };
    }

    // Stripe collects UPI on its own hosted page: create the session here, then
    // hand over. It redirects back to checkout-success / checkout-cancel.
    async function payWithStripe(g, btn) {
      btn.disabled = true; btn.textContent = "Redirecting…";
      try {
        const { res, data } = await postJSON(CHECKOUT_URL, { items: cartItems(), method: "upi", provider: g.id });
        if (res.ok && data.ok && data.url) { location.href = data.url; return; }
        warn(data.code === "service_not_configured" ? notConfiguredMessage(g) : (data.message || `Couldn't start the ${g.label} payment. Please try again.`));
      } catch {
        warn(`Couldn't reach ${g.label}. Check your connection, or pay by Cash on Delivery.`);
      } finally {
        btn.disabled = false; btn.textContent = "Order Now";
      }
    }

    // Razorpay collects UPI in its popup: the function creates and prices the
    // order, the popup collects the payment, then the signature is verified
    // server-side before the order is recorded.
    async function payWithRazorpay(g, btn) {
      btn.disabled = true; btn.textContent = "Loading…";
      try {
        const { res, data } = await postJSON(RAZORPAY_ORDER_URL, { items: cartItems() });
        if (!res.ok || !data.ok || !data.orderId) {
          warn(data.code === "service_not_configured" ? notConfiguredMessage(g) : (data.message || `Couldn't start the ${g.label} payment. Please try again.`));
          return;
        }
        await loadRazorpay();
        const acc = currentAccount();
        btn.textContent = "Waiting for approval…";
        const rzp = new window.Razorpay({
          key: data.keyId,
          amount: data.amount,
          currency: data.currency,
          name: getCatalogSettings().storeName,
          description: "Order payment",
          order_id: data.orderId,
          // UPI only — the rest of the gateway's methods stay off the popup.
          config: {
            display: {
              blocks: { upi: { name: "Pay by UPI", instruments: [{ method: "upi" }] } },
              sequence: ["block.upi"],
              preferences: { show_default_blocks: false },
            },
          },
          prefill: {
            name: (address && address.name) || (acc && acc.name) || "",
            email: (acc && acc.email) || "",
          },
          theme: { color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1f6f5c" },
          handler: async (resp) => {
            btn.textContent = "Verifying…";
            try {
              const v = await postJSON(RAZORPAY_VERIFY_URL, resp);
              if (v.res.ok && v.data.ok) {
                location.href = `checkout-success.html?method=upi&provider=razorpay&session_id=${encodeURIComponent(resp.razorpay_payment_id || "")}`;
                return;
              }
              warn(v.data.message || "The payment couldn't be verified. If money left your account, contact support with your UPI reference.");
            } catch {
              warn("The payment couldn't be verified. If money left your account, contact support with your UPI reference.");
            } finally {
              btn.disabled = false; btn.textContent = "Order Now";
            }
          },
          modal: {
            ondismiss: () => {
              warn("The UPI payment was closed before it was approved. No money has been taken.");
              btn.disabled = false; btn.textContent = "Order Now";
            },
          },
        });
        rzp.on("payment.failed", (e) => {
          warn((e && e.error && e.error.description) || "The UPI payment failed. Please try again or pay by Cash on Delivery.");
          btn.disabled = false; btn.textContent = "Order Now";
        });
        rzp.open();
      } catch {
        warn(`Couldn't load ${g.label}'s checkout. Check your connection, or pay by Cash on Delivery.`);
      } finally {
        if (btn.textContent === "Loading…") { btn.disabled = false; btn.textContent = "Order Now"; }
      }
    }

    document.getElementById("order-now").addEventListener("click", (ev) => {
      const btn = ev.currentTarget;
      noticeEl.innerHTML = "";
      const checked = document.querySelector('input[name="pm"]:checked');
      const value = checked ? checked.value : "cod";
      if (value === "cod") { location.href = "checkout-success.html?method=cod"; return; }
      const g = paymentProvider(value.slice(4));
      if (!g) { warn("That payment method is no longer available. Please choose another."); return; }
      if (g.id === "razorpay") payWithRazorpay(g, btn);
      else payWithStripe(g, btn);
    });
  </script>
</body>
</html>
