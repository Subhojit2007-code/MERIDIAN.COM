<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — Meridian</title>
  <meta name="description" content="Every Meridian product matching your search." />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html"><span class="mark">M</span><span data-store-name>Meridian</span></a>
      <nav class="main-nav" aria-label="Primary">
        <a href="../index.html">Shop</a>
        <a href="../index.html#catalogue">Categories</a>
      </nav>
      <div class="header-actions">
        <form class="search" role="search" action="search.html" method="get" id="search-form">
          <input type="search" id="search-input" name="q" placeholder="Search products…" aria-label="Search products" autocomplete="off" />
          <button type="submit" aria-label="Search">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </form>
        <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.6C1.2 8.4 3 5 6.4 5c2 0 3.4 1 4.1 2.3h3c.7-1.3 2.1-2.3 4.1-2.3 3.4 0 5.2 3.4 3.6 6.4C19 15.4 12 20 12 20Z" transform="translate(0 -1)"/></svg>
          <span class="icon-badge" data-wishlist-count data-count="0">0</span>
        </a>
        <a class="icon-btn" href="orders.html" aria-label="Your orders">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        </a>
        <a class="icon-btn" href="profile.html" aria-label="Your profile">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        </a>
        <a class="cart-link" href="cart.html" aria-label="View cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.3 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 7H5.3"/></svg>
          <span>Cart</span>
          <span class="cart-badge" data-cart-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="section" id="catalogue">
      <div class="section-head">
        <div>
          <h2 id="search-title">Search results</h2>
          <p><span id="result-count">0</span> products match</p>
        </div>
        <div class="head-actions">
          <button type="button" class="btn btn-outline" id="open-filters" aria-expanded="false">Filters</button>
          <button type="button" class="btn btn-outline" id="open-price" aria-expanded="false">Sort by</button>
          <a class="btn btn-outline" href="../index.html#catalogue">Browse everything</a>
        </div>
      </div>

      <div class="variant-filters" id="variant-filters" hidden>
        <div class="vf-head">
          <span class="vf-title" id="vf-title">Filters</span>
          <span class="vf-head-actions">
            <button type="button" class="vf-clear" id="clear-filters" hidden>Clear</button>
            <button type="button" class="vf-close" id="close-filters" aria-label="Close filters">✕</button>
          </span>
        </div>
        <div class="vf-groups" id="vf-groups" role="group" aria-label="Filter by product options"></div>
        <div class="vf-foot" id="vf-foot" hidden>
          <button type="button" class="btn btn-primary" id="see-products" hidden>See Products</button>
        </div>
      </div>

      <div class="variant-filters price-panel" id="price-panel" hidden>
        <div class="vf-head">
          <span class="vf-title">Sort by price range</span>
          <span class="vf-head-actions">
            <button type="button" class="vf-clear" id="price-clear" hidden>Clear</button>
            <button type="button" class="vf-close" id="close-price" aria-label="Close price range">✕</button>
          </span>
        </div>
        <div class="price-fields">
          <label class="price-field"><span>Minimum (₹)</span><input id="price-min" type="number" min="0" step="1" inputmode="numeric" placeholder="0" /></label>
          <span class="price-dash" aria-hidden="true">–</span>
          <label class="price-field"><span>Maximum (₹)</span><input id="price-max" type="number" min="0" step="1" inputmode="numeric" placeholder="Any" /></label>
        </div>
        <p class="price-error" id="price-error" hidden></p>
        <div class="vf-foot">
          <button type="button" class="btn btn-primary" id="apply-price">Continue</button>
        </div>
      </div>

      <div class="grid" id="grid" aria-live="polite"></div>

      <p id="no-results" class="empty" hidden>No products match your search, filters or price range.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div><p>© 2026 <span data-store-name>Meridian</span> Supply Co. Sample storefront — products and prices are illustrative.</p></div>
      <nav class="footer-links" aria-label="Footer">
        <a href="../index.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="admin.html">Admin</a>
        <button type="button" data-policy-open aria-haspopup="dialog">Store policy</button>
      </nav>
    </div>
  </footer>

  <script src="../js/images.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/catalogue.js"></script>
  <script>
    const title = document.getElementById("search-title");
    const searchInput = document.getElementById("search-input");
    const searched = (new URLSearchParams(location.search).get("q") || "").trim();

    function showQuery(q) { title.textContent = q ? `Results for “${q}”` : "All products"; }
    showQuery(searched);

    // This page narrows as you type and keeps the address shareable.
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim();
      setCatalogueQuery(q);
      showQuery(q);
      history.replaceState(null, "", q ? "search.html?q=" + encodeURIComponent(q) : "search.html");
    });

    // Another page lands here on the first keystroke, so hand the caret back.
    document.addEventListener("DOMContentLoaded", () => {
      if (!searched) return;
      searchInput.focus();
      searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
    });
  </script>
</body>
</html>
